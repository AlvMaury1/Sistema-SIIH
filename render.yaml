databases:
  - name: siih-db
    plan: free
    databaseName: siih
    user: siih

services:
  - name: siih-backend
    type: web
    runtime: python
    plan: free
    rootDir: backend/backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi:app db upgrade && gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siih-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://siih-frontend.onrender.com

  - name: siih-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://siih-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
