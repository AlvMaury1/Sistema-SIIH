databases:
  - name: siih-db
    plan: free
    databaseName: siih
    user: siih

services:
  - name: siih-backend
    type: web
    runtime: python
    plan: free
    rootDir: backend/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siih-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: siih-frontend
          property: hostport

  - name: siih-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: siih-backend
          property: hostport
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
